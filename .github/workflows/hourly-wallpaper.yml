name: Hourly Earth Wallpaper

on:
  workflow_call:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: earthwall-pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: cache
          key: earthwall-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: earthwall-cache-${{ runner.os }}-
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: Publish a verified server pair with independent render fallback
        run: |
          if ! python -m earthwall.delivery --output public; then
            earthwall --cache cache --output public --follow-server
          fi
      - run: earthwall-qa public | tee public/qa.json
      - run: python scripts/cleanup_server_cache.py cache
      - run: cp web/* public/
      - uses: actions/configure-pages@v6
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Keep public-repository schedule active
        if: github.event_name == 'schedule'
        run: |
          if [[ "$(date -u '+%d %H')" != "01 00" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%FT%TZ' > .github/schedule-heartbeat
          git add .github/schedule-heartbeat
          git commit -m "chore keep hourly schedule active [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main


  deploy:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded archive to be readable
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.render.outputs.artifact_id }}
        run: |
          for delay in 3 6 12 24 30; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/pages.zip" &&
               unzip -tqq "$RUNNER_TEMP/pages.zip"; then
              exit 0
            fi
            sleep "$delay"
          done
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.render.outputs.artifact_id }}
        with:
          script: |
            const artifact = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifact) || artifact <= 0) throw new Error('Missing Pages artifact ID')
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifact, pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            })
            core.setOutput('page_url', deployment.data.page_url)
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000))
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                ...context.repo, id: deployment.data.id
              })
              if (data.status === 'succeed') return
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled',
                   'failed', 'cancelled'].includes(data.status)) throw new Error(data.status)
            }
            throw new Error('Timed out waiting for Pages deployment')
