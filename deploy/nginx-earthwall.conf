location = /earthwall/api/location {
    access_log off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8131/location;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}

location = /earthwall/api/status {
    access_log off;
    proxy_pass http://127.0.0.1:8131/status;
    proxy_set_header Authorization $http_authorization;
}

location = /earthwall/api/health {
    access_log off;
    proxy_pass http://127.0.0.1:8131/health;
}

location ^~ /earthwall/ {
    alias /srv/earthwall/current/;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
}

location ^~ /earthwall/releases/ {
    alias /srv/earthwall/releases/;
    autoindex off;
    add_header Cache-Control "private, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
}
